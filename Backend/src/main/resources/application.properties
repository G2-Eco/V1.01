spring.application.name=backend-ecommerce

# Database configuration - uses env variables if available, falls back to local
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ecom?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=IMAD10imad@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
