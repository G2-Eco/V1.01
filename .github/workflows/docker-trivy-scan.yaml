name: Docker Image Scan (Trivy)

on:
  push:
    branches:
      - v2devsecops
  pull_request:
    branches:
      - v2devsecops

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t backend-app:latest -f Backend/dockerfile Backend

      # ---------------------------------------------------------
      # Scan 1 : Rapport complet (LOW + MEDIUM + HIGH + CRITICAL)
      # NE DOIT PAS ÉCHOUER
      # ---------------------------------------------------------
      - name: Full Trivy Image Scan (HTML report)
        run: |
          trivy image \
            --format template \
            --template "@/contrib/html.tpl" \
            --output trivy-report.html \
            --scanners vuln,misconfig \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            backend-app:latest || true   # NE PAS ÉCHOUER

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-report.html

      # ---------------------------------------------------------
      # Scan 2 : Only HIGH/CRITICAL → Fail if found
      # Pipeline must FAIL if HIGH/CRITICAL are detected
      # ---------------------------------------------------------
      - name: Enforce security (High/Critical only)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed=false \
            backend-app:latest

