name: Docker Image Scan (Trivy)

on:
  push:
    branches:
      - v2devsecops
  pull_request:
    branches:
      - v2devsecops

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1) Installer Trivy (méthode officielle via script)
      - name: Install Trivy via script
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      # 2) Build Docker image
      - name: Build backend Docker image
        run: docker build -t backend-app:latest -f Backend/dockerfile Backend

      # 3) FULL HTML REPORT (LOW → CRITICAL)
      - name: Full Trivy HTML report
        run: |
          trivy image \
            --scanners vuln,misconfig \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format template \
            --template "@/contrib/html.tpl" \
            --output trivy-report.html \
            backend-app:latest || true

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-report.html

      # 4) FAIL ONLY if HIGH or CRITICAL exist
      - name: Fail build on HIGH/CRITICAL
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed=false \
            backend-app:latest
