name: Docker Image Scan (Trivy)

on:
  push:
    branches:
      - v2devsecops
  pull_request:
    branches:
      - v2devsecops

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t backend-app:latest -f Backend/dockerfile Backend

      # ---------------------------------------------------------
      # Installer Trivy (OBLIGATOIRE sinon "command not found")
      # ---------------------------------------------------------
      - name: Install Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          command: version

      # ---------------------------------------------------------
      # Scan 1 : Full Scan (HTML report)
      # ---------------------------------------------------------
      - name: Full Trivy Image Scan (HTML report)
        run: |
          trivy image \
            --scanners vuln,misconfig \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format template \
            --template "@/contrib/html.tpl" \
            --output trivy-report.html \
            backend-app:latest || true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-report.html

      # ---------------------------------------------------------
      # Scan 2 : Fail only on HIGH/CRITICAL
      # ---------------------------------------------------------
      - name: Enforce security (High/Critical only)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed=false \
            backend-app:latest
