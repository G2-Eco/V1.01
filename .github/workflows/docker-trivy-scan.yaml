name: Docker Image Scan (Trivy)

on:
  push:
    branches:
      - v2devsecops
  pull_request:
    branches:
      - v2devsecops

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Étape 1 : Construire l’image Docker du backend
      - name: Build backend Docker image
        run: |
          docker build -t backend-app:latest -f Backend/dockerfile Backend

      # Étape 2 : Scanner l'image et générer un rapport HTML
      - name: Run Trivy scan (HTML report)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: image
          image-ref: backend-app:latest
          format: template
          template: "@/contrib/html.tpl"
          output: trivy-report.html
          exit-code: 0             # Ne pas échouer le job (optionnel)
          severity: HIGH,CRITICAL  # Tu peux mettre: LOW,MEDIUM,HIGH,CRITICAL

      # Étape 3 : Upload du rapport HTML comme artefact GitHub
      - name: Upload Trivy HTML report
        uses: actions/upload-artifact@v3
        with:
          name: trivy-docker-report
          path: trivy-report.html
