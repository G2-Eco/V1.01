name: Docker Image Scan (Trivy)

on:
  push:
    branches:
      - v2devsecops
  pull_request:
    branches:
      - v2devsecops

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 1 : Construire l’image Docker
      - name: Build backend Docker image
        run: |
          docker build -t backend-app:latest -f Backend/dockerfile Backend

      # Étape 2 : Exécuter Trivy + générer rapport HTML
      - name: Run Trivy scan (HTML report)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: image
          image-ref: backend-app:latest
          format: template
          template: "@/contrib/html.tpl"
          output: trivy-report.html
          exit-code: 0
          severity: HIGH,CRITICAL

      # Étape 3 : Upload HTML report (nouvelle version v4)
      - name: Upload Trivy HTML report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-report.html
