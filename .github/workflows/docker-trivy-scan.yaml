name: Docker Image Scan (Trivy)

on:
  push:
    branches:
      - v2devsecops
  pull_request:
    branches:
      - v2devsecops

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      # 1) Clone repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Install Trivy manually (méthode officielle recommandée)
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb stable main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # 3) Build Docker image
      - name: Build backend Docker image
        run: |
          docker build -t backend-app:latest -f Backend/dockerfile Backend

      # 4) Full HTML report (LOW → CRITICAL)
      - name: Full Trivy HTML report
        run: |
          trivy image \
            --scanners vuln,misconfig \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format template \
            --template "@/contrib/html.tpl" \
            --output trivy-report.html \
            backend-app:latest || true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-docker-report
          path: trivy-report.html
          if-no-files-found: warn

      # 5) FAIL ONLY IF HIGH or CRITICAL
      - name: Fail pipeline if HIGH/CRITICAL exist
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed=false \
            backend-app:latest
