name: Backend SonarQube Analysis

on:
  push:
    branches:
      - v2devsecops
      - v2
  pull_request:
    branches:
      - v2devsecops
      - v2

jobs:
  sonar:
    runs-on: ubuntu-latest

    # LANCER SONARQUBE AUTOMATIQUEMENT DANS GITHUB ACTIONS
    services:
      sonarqube:
        image: sonarqube:latest
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        options: >-
          --health-cmd="curl -f http://localhost:9000/api/system/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # ATTENDRE QUE SONARQUBE SOIT OPÉRATIONNEL
      - name: Wait for SonarQube to be ready
        run: |
          echo "⏳ Waiting for SonarQube to start..."
          for i in {1..40}; do
            STATUS=$(curl -s http://localhost:9000/api/system/status | jq -r '.status' || echo "DOWN")
            if [ "$STATUS" = "UP" ]; then
              echo "🚀 SonarQube is UP!"
              break
            fi
            echo "Still starting... ($i/40)"
            sleep 5
          done

      - name: Build backend (Maven)
        run: mvn -f backend/pom.xml clean verify -DskipTests

      - name: Run SonarQube Analysis
        run: |
          mvn -f backend/pom.xml sonar:sonar \
            -Dsonar.projectKey=ecom-backend \
            -Dsonar.projectName="Ecom Backend" \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=admin \
            -Dsonar.password=admin
