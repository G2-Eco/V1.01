services:
  mysql:
    # 1. New: Specify the target image name for Docker Hub
    image: amvdown/ecom-mysql:latest 
    # 2. New: Use the build context for the custom image
    build: 
      context: ./database/init/ 
      dockerfile: Dockerfile
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecom
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      # 3. Modified: Removed the init volume, keeping only the data volume
      - mysql_data:/var/lib/mysql 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # New: Specify the target image name for Docker Hub
    image: amvdown/ecom-backend:latest
    build: ./Backend
    container_name: backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecom?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

  frontend:
    # New: Specify the target image name for Docker Hub
    image: amvdown/ecom-frontend:latest
    build: ./FrontEnd
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080/api/v1

volumes:
  mysql_data: