services:
  mysql:
    # 1. New: Specify the target image name for Docker Hub
    image: amvdown/ecom-mysql:latest
    # 2. New: Use the build context for the custom image
    build: 
      context: ./database/init/
      dockerfile: Dockerfile
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecom
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      # 3. Modified: Removed the init volume, keeping only the data volume
      - mysql_data:/var/lib/mysql 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

