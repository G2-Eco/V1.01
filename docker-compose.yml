# ==============================================================================
# 1. SECRET: Stores sensitive environment variables (from environment block in docker-compose)
# Note: In production, use a dedicated vault solution or inject secrets via an operator.
# The 'data' fields below are base64 encoded.
#   e.g., echo -n 'root' | base64
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ecom-db-secret
type: Opaque
data:
  # Base64 encoded values for the database credentials
  MYSQL_ROOT_PASSWORD: cm9vdA==      # root
  MYSQL_DATABASE: ZWNvbQ==          # ecom
  MYSQL_USER: dXNlcg==              # user
  MYSQL_PASSWORD: cGFzc3dvcmQ=      # password
---
# ==============================================================================
# 2. PERSISTENT VOLUME CLAIM (PVC): For the mysql_data volume
# This requests persistent storage for the database state.
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ecom-mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi # Requesting 5 GB of storage
---
# ==============================================================================
# 3. MYSQL DATABASE DEPLOYMENT AND SERVICE
# Based on the 'mysql' service in docker-compose.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-mysql-deployment
  labels:
    app: ecom-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecom-mysql
  template:
    metadata:
      labels:
        app: ecom-mysql
    spec:
      containers:
      - name: mysql
        image: amvdown/ecom-database:latest
        ports:
        - containerPort: 3306
        env:
        # Load credentials from the Secret
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecom-db-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: ecom-db-secret
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: ecom-db-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecom-db-secret
              key: MYSQL_PASSWORD
        # Volume mount for persistent data
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
        # Readiness/Liveness probes simulate the 'healthcheck' from docker-compose
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost"]
          initialDelaySeconds: 15
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 5
      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: ecom-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-mysql-service
spec:
  selector:
    app: ecom-mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: ClusterIP # Internal only service
---
# ==============================================================================
# 4. BACKEND DEPLOYMENT AND SERVICE
# Simulates 'depends_on: service_healthy' using an InitContainer to wait for MySQL.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-backend-deployment
  labels:
    app: ecom-backend
spec:
  replicas: 2 # Running multiple replicas for resilience
  selector:
    matchLabels:
      app: ecom-backend
  template:
    metadata:
      labels:
        app: ecom-backend
    spec:
      # InitContainer waits for the MySQL service (ecom-mysql-service) to be ready on port 3306.
      initContainers:
      - name: wait-for-db
        image: busybox:1.36.1 # A lightweight image for running simple commands
        command: ['sh', '-c', 'until nc -z ecom-mysql-service 3306; do echo waiting for db; sleep 2; done;']
      containers:
      - name: backend
        image: amvdown/ecom-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          # Note: Host 'mysql' is replaced with the Kubernetes Service Name 'ecom-mysql-service'
          value: "jdbc:mysql://ecom-mysql-service:3306/ecom?useSSL=false&allowPublicKeyRetrieval=true"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        # Load credentials from the Secret
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: ecom-db-secret
              key: MYSQL_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ecom-db-secret
              key: MYSQL_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-backend-service
spec:
  selector:
    app: ecom-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP # Internal only service for communication with the frontend
---
# ==============================================================================
# 5. FRONTEND DEPLOYMENT AND SERVICE
# Based on the 'frontend' service in docker-compose.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-frontend-deployment
  labels:
    app: ecom-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecom-frontend
  template:
    metadata:
      labels:
        app: ecom-frontend
    spec:
      containers:
      - name: frontend
        image: amvdown/ecom-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_BASE_URL
          # This should point to the external address if used in the browser,
          # but we'll use the internal service for the container's internal configuration.
          # For browser/client-side calls, you'll need the external IP/Port of the backend.
          value: "http://ecom-backend-service:8080/api/v1"
        - name: API_BASE_URL
          # Internal communication between frontend and backend
          value: "http://ecom-backend-service:8080/api/v1"
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-frontend-service
spec:
  selector:
    app: ecom-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      # NodePort exposes the service externally on a high port (e.g., 30000-32767)
      # You can access the app at http://<NodeIP>:<NodePort>
  type: NodePort